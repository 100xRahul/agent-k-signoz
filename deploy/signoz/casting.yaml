# SigNoz self-host via Foundry (https://github.com/SigNoz/foundry).
# `make setup-signoz` runs `foundryctl forge -f casting.yaml` here; the
# generated manifests land in pours/deployment/ and are committed so a
# fresh clone can `make up` without foundryctl installed.
#
# Patches add network aliases so the rest of the stack can keep the
# canonical hostnames `signoz` (UI/API) and `signoz-otel-collector` (OTLP).
apiVersion: v1alpha1
kind: Installation
metadata:
  name: signoz
spec:
  deployment:
    flavor: compose
    mode: docker
  patches:
    - target: "deployment/compose.yaml"
      operations:
        - op: add
          path: /services/ingester/networks/signoz-network/aliases/-
          value: signoz-otel-collector
        - op: replace
          path: /services/signoz-signoz-0/networks
          value:
            signoz-network:
              aliases:
                - signoz
