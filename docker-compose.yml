services:
  # ─── MCP Server ─────────────────────────────────────────
  mcp-server:
    image: signoz/signoz-mcp-server:latest
    environment:
      - TRANSPORT_MODE=http
      - SIGNOZ_URL=http://signoz:8080
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY}
    ports:
      - "8000:8000"
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Postgres (sandbox) ────────────────────────────────
  sandbox-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments123
    volumes:
      - sandbox_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - signoz-network

  # ─── Redis (sandbox) ───────────────────────────────────
  sandbox-redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - signoz-network

  # ─── Gateway ───────────────────────────────────────────
  gateway:
    build: ./sandbox/gateway
    ports:
      - "8001:8001"
    environment:
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
      - CHECKOUT_URL=http://checkout:8002
      - INVENTORY_URL=http://inventory:8004
    depends_on:
      - checkout
      - inventory
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Checkout ──────────────────────────────────────────
  checkout:
    build: ./sandbox/checkout
    ports:
      - "8002:8002"
    environment:
      - OTEL_SERVICE_NAME=checkout
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      # No service.version here on purpose: checkout's version is dynamic
      # (Redis-driven deploys) and stamped per-span; a static resource value
      # would shadow the span attribute in group-by queries.
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production
      - SERVICE_VERSION=${CHECKOUT_VERSION:-1.4.1}
      - CHAOS_MODE=${CHAOS_MODE:-}
      - PAYMENT_URL=http://payment:8003
      - INVENTORY_URL=http://inventory:8004
      - REDIS_URL=redis://sandbox-redis:6379
    depends_on:
      sandbox-redis:
        condition: service_healthy
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Payment ───────────────────────────────────────────
  payment:
    build: ./sandbox/payment
    ports:
      - "8003:8003"
    environment:
      - OTEL_SERVICE_NAME=payment
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
      - PG_DSN=postgresql://payments:payments123@sandbox-postgres:5432/payments
      - POOL_SIZE=10
      - REDIS_URL=redis://sandbox-redis:6379
    depends_on:
      sandbox-postgres:
        condition: service_healthy
      sandbox-redis:
        condition: service_healthy
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Inventory ─────────────────────────────────────────
  inventory:
    build: ./sandbox/inventory
    ports:
      - "8004:8004"
    environment:
      - OTEL_SERVICE_NAME=inventory
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
      - REDIS_URL=redis://sandbox-redis:6379
    depends_on:
      sandbox-redis:
        condition: service_healthy
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Load Generator ───────────────────────────────────
  loadgen:
    build: ./sandbox/loadgen
    environment:
      - TARGET=http://gateway:8001
      - RPS=5
      - REDIS_URL=redis://sandbox-redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
    depends_on:
      - gateway
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Agent K ───────────────────────────────────────────
  agent:
    build:
      context: .
      dockerfile: agent/Dockerfile
    ports:
      - "9000:9000"
    environment:
      - OTEL_SERVICE_NAME=agent-k
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment=production,service.version=1.0.0
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-sk-placeholder}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LLM_INPUT_PRICE_PER_MTOK=${LLM_INPUT_PRICE_PER_MTOK:-0.15}
      - LLM_OUTPUT_PRICE_PER_MTOK=${LLM_OUTPUT_PRICE_PER_MTOK:-0.60}
      # Independent auditor — empty AUDITOR_MODEL reuses OPENAI_MODEL.
      - AUDITOR_ENABLED=${AUDITOR_ENABLED:-true}
      - AUDITOR_MODEL=${AUDITOR_MODEL:-}
      - AUDITOR_BASE_URL=${AUDITOR_BASE_URL:-}
      - AUDITOR_API_KEY=${AUDITOR_API_KEY:-}
      - SIGNOZ_URL=${SIGNOZ_URL:-http://localhost:8080}
      - SIGNOZ_INTERNAL_URL=http://signoz:8080
      - SIGNOZ_API_KEY=${SIGNOZ_API_KEY}
      - MCP_URL=http://mcp-server:8000
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - AGENT_PUBLIC_URL=${AGENT_PUBLIC_URL:-http://localhost:9000}
      - APPROVAL_SECRET=${APPROVAL_SECRET:-change-me}
      - AUTO_APPROVE=${AUTO_APPROVE:-false}
      - INVESTIGATION_COOLDOWN_MINUTES=${INVESTIGATION_COOLDOWN_MINUTES:-15}
      - MAX_ITERATIONS=${MAX_ITERATIONS:-20}
      - MAX_COST_USD_PER_INVESTIGATION=${MAX_COST_USD_PER_INVESTIGATION:-1.00}
      - DB_PATH=/data/agentk.db
      - REDIS_URL=redis://sandbox-redis:6379
    volumes:
      - agent_data:/data
      # Socket only for the guarded `restart` remediation (docker restart by
      # compose-service label). Rollback/flags go through Redis — no docker needed.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - mcp-server
      - sandbox-redis
    networks:
      - signoz-network
    restart: unless-stopped

  # ─── Chaos CLI (run on-demand) ──────────────────────
  chaos:
    build: ./sandbox/chaos
    profiles: ["tools"]
    environment:
      - REDIS_URL=redis://sandbox-redis:6379
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://signoz-otel-collector:4317
    networks:
      - signoz-network

volumes:
  sandbox_pgdata:
  agent_data:

networks:
  signoz-network:
    external: true
    name: signoz-network
